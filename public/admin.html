<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Luma Admin</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%237a4b2a'/%3E%3Ctext x='16' y='22' font-size='17' font-family='sans-serif' font-weight='700' text-anchor='middle' fill='white'%3EL%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="/app.css">
</head>
<body>
  <!-- login / first-time setup -->
  <div id="auth" class="wrap hidden">
    <div class="card login">
      <div class="brand" style="margin-bottom:16px">
        <div class="logo">L</div>
        <div><h1 data-company>Luma Apparels</h1><div class="muted small">Admin panel</div></div>
      </div>
      <form id="login-form">
        <p class="muted small" data-setup-msg></p>
        <label>Admin password<input type="password" name="password" autocomplete="current-password" required autofocus></label>
        <label data-confirm class="hidden" style="margin-top:10px">Confirm password<input type="password" name="confirm" autocomplete="new-password"></label>
        <div class="form-actions"><a class="btn" href="/">Back</a><button class="primary" data-submit>Log in</button></div>
      </form>
    </div>
  </div>

  <!-- app -->
  <div id="app" class="wrap hidden">
    <header class="topbar">
      <div class="brand">
        <div class="logo">L</div>
        <div><h1 data-company>Luma Apparels</h1><div class="muted small">Admin panel</div></div>
      </div>
      <div class="spacer"></div>
      <a class="btn no-print" href="/">Clock-in page</a>
      <button id="logout" class="no-print">Log out</button>
    </header>

    <nav class="tabs" role="tablist">
      <button data-tab="today" class="active">Today</button>
      <button data-tab="attendance">Attendance</button>
      <button data-tab="leaves">Leaves</button>
      <button data-tab="salary">Salary &amp; incentive</button>
      <button data-tab="employees">Employees</button>
      <button data-tab="settings">Settings</button>
    </nav>

    <main id="view"></main>
  </div>

  <script src="/common.js"></script>
  <script src="/admin.js"></script>
</body>
</html>
